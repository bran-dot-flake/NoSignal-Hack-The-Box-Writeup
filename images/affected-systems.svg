<title id="title">Observed CCTV systems and network traffic</title>
<desc id="desc">The attacker 192.168.50.200 scanned camera CAM2 and host 192.168.50.5. Camera CAM2 and camera CAM1 streamed RTP video to 192.168.50.5, likely a recorder. The diagram is a logical traffic map, not a physical network diagram.</desc>
